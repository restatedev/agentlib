packages:
  - packages/*

allowBuilds:
  # Optional native speedups and a version check; none are needed at runtime.
  cbor-extract: false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - openai@7.17.0
  - "@restatedev/restate-sdk-clients@1.17.2"
  - "@restatedev/restate-sdk-core@1.17.2"
  - "@restatedev/restate-sdk-gen@1.17.2"
  - "@restatedev/restate-sdk-testcontainers@1.17.2"
  - "@restatedev/restate-sdk@1.17.2"
